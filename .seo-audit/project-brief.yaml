  address: 1658-1660 Baseline Road, Nepean, Ottawa, ON, Canada
  offer: Furnished all-inclusive student rooms (Unit A and Unit B)
  pricing:
    unit_b_single: $850/month
    unit_a_single: $900/month
    unit_b_pair: $1000/month
    unit_a_pair: $1200/month
